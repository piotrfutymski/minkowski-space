[package]
name = "minkowski-space"
version = "0.1.0"
edition = "2024"
description = "A 2+1-dimensional Minkowski spacetime simulation library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/piotrfutymski/minkowski-space"
homepage = "https://github.com/piotrfutymski/minkowski-space"
documentation = "https://docs.rs/minkowski-space"
keywords = ["physics", "relativity", "minkowski", "simulation"]
categories = ["science", "simulation"]

[dependencies]
vector2d = "3.1.1"
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "collision_benchmarks"
harness = false